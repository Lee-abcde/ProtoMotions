# 2-GPU validation variant: 1 locomotion rank (AMASS-X shard 0) and 1 HOI rank.
# The 8 OMOMO subjects below are the smallest spread that still covers all 13
# object types, so object-curriculum env assignment behaves as in the full run.
# Paths are inside the Apptainer mounts from s1_joint_pvq_euler.sbatch.
# OMOMO: 8 of the 15 subjects, each with its own v8_29 tracker.
# HOI sources are assigned round-robin to the HOI ranks in the order listed.
locomotion_num_ranks: 1
hoi_weight: 0.5
sources:
