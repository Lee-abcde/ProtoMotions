# 4-GPU validation variant of s1_joint_pvq_sources_euler.yaml: 2 locomotion ranks
# (AMASS-X shards 0 and 1, i.e. half the dataset) and 2 HOI ranks.
# Paths are inside the Apptainer mounts from s1_joint_pvq_euler.sbatch.
# OMOMO: 15 subjects (sub11 and sub14 excluded), each with its own v8_29 tracker.
# HOI sources are assigned round-robin to the HOI ranks in the order listed.
locomotion_num_ranks: 2
hoi_weight: 0.5
sources:
