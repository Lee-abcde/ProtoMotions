    task: locomotion
    motion_file: /workspace/protomotion_data/amassx_shards/amassx_slurmrank.pt
    motion_file_shard_indices: [0, 1]
    teacher_checkpoint: /workspace/loco_teachers/gcc_s0_loco_tracker_amassx_v1/score_based.ckpt
    weight: 1.0
  - id: omomo_sub1
    task: hoi
    motion_file: /workspace/protomotion_data/omomo_correct_v2_contact_retarget_arms_v3/motions/by_subject/sub1.pt
