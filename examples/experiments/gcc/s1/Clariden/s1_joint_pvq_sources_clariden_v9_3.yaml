# Clariden (4x GH200 per node): one rank loads the full AMASS-X dataset; three ranks train HOI.
# Motion libraries remain fixed throughout training (no shard switching).
# Absolute Store paths, so the run does not depend on the scratch symlinks under data/ and results/.
# OMOMO: 16 training subjects; sub14 is held out as the test set. Each has its own v9_3 tracker
# (s0_hoi_tracker_v2.py, grip DOF tanh gain 2). The locomotion teacher keeps gain 1; a new run
# distills both into a gain-one student.
# HOI sources are assigned round-robin to the HOI ranks in the order listed.
locomotion_num_ranks: 1
hoi_weight: 0.5
# task: split the loss hoi_weight : 1 - hoi_weight between tasks.
# sample: every rollout sample weighs the same (hoi_weight is then unused), so the
# task split follows the layout.
loss_balance: task
sources:
  - id: amassx
    task: locomotion
    motion_file: /capstor/store/cscs/swissai/abs33/jli/data/amassx/amass_smplx_train.pt
    teacher_checkpoint: /capstor/store/cscs/swissai/abs33/jli/checkpoints/teachers/gcc_s0_loco_tracker_amassx_v1/score_based.ckpt
    weight: 1.0
  - id: omomo_sub1
    task: hoi
    motion_file: /capstor/store/cscs/swissai/abs33/jli/data/omomo_correct_v2_contact_retarget_arms_v3/motions/by_subject/sub1.pt
